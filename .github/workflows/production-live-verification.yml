name: Production live verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-verification
  cancel-in-progress: true

jobs:
  verify-deployed-commit:
    # Keep browser system dependencies stable during the ubuntu-latest 26.04 migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for Cloudflare and verify the exact live commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node tools/verify-live-release.js --commit="$EXPECTED_COMMIT" --wait-seconds=600
      - name: Install browser for homepage state verification
        run: npx playwright install --with-deps chromium
      - name: Verify live homepage contrast and form states without sending leads
        run: npm run test:homepage-all-states -- --base=https://atelierdeconsultanta.ro
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-state-accessibility
          path: .codex/homepage-states-live/audit.json
          include-hidden-files: true
