name: Production live verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-verification
  cancel-in-progress: true

jobs:
  verify-deployed-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Cloudflare and verify the exact live commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node tools/verify-live-release.js --commit="$EXPECTED_COMMIT" --wait-seconds=600
