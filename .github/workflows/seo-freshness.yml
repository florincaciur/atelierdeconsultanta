name: SEO integrity audit

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-seo-inventory:
    name: Verify canonical inventory without changing lastmod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sitemap and llms inventory
        run: |
          node tools/verify-sitemap.js
          node scripts/verify-llms-urls.js

      - name: Check public site health
        run: curl --fail --silent --show-error --location https://atelierdeconsultanta.ro/ --output /dev/null
